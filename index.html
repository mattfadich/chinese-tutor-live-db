<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chinese Tutor AI Live Database</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f5ef; color: #1f2933; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    main { width: min(760px, 100%); background: #ffffff; border: 1px solid #d8d4c7; border-radius: 8px; padding: 28px; box-shadow: 0 18px 45px rgba(31, 41, 51, 0.12); }
    h1 { margin: 0 0 8px; font-size: 2rem; line-height: 1.15; }
    .meta { margin: 0 0 24px; color: #5d6570; }
    dl { display: grid; grid-template-columns: minmax(160px, 1fr) minmax(120px, 2fr); gap: 12px 18px; margin: 0; }
    dt { font-weight: 700; color: #39424e; }
    dd { margin: 0; }
    .error { color: #9f1239; font-weight: 700; }
    @media (max-width: 560px) { body { padding: 18px; place-items: start stretch; } main { padding: 20px; } dl { grid-template-columns: 1fr; gap: 6px 0; } dd { margin-bottom: 10px; } }
  </style>
</head>
<body>
  <main>
    <h1>Chinese Tutor AI</h1>
    <p class="meta">Live tutoring database read view</p>
    <dl>
      <dt>Last updated</dt><dd id="last-updated">Loading...</dd>
      <dt>Profile summary</dt><dd id="profile-summary">Loading...</dd>
      <dt>Recent sessions</dt><dd id="recent-sessions">Loading...</dd>
      <dt>Vocabulary</dt><dd id="vocabulary">Loading...</dd>
      <dt>Grammar</dt><dd id="grammar">Loading...</dd>
      <dt>Review targets</dt><dd id="review-targets">Loading...</dd>
    </dl>
  </main>
  <script>
    const count = value => Array.isArray(value) ? value.length : 0;
    const profileSummary = profile => {
      if (!profile || typeof profile !== "object" || Array.isArray(profile)) return "No profile data yet";
      const entries = Object.entries(profile);
      if (!entries.length) return "No profile data yet";
      return entries.map(([key, value]) => key + ": " + String(value)).join(", ");
    };
    fetch("tutor-database.json", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(data => {
        document.getElementById("last-updated").textContent = data.last_updated || "Not refreshed yet";
        document.getElementById("profile-summary").textContent = profileSummary(data.profile);
        document.getElementById("recent-sessions").textContent = String(count(data.recent_sessions));
        document.getElementById("vocabulary").textContent = String(count(data.vocabulary));
        document.getElementById("grammar").textContent = String(count(data.grammar));
        document.getElementById("review-targets").textContent = String(count(data.review_targets));
      })
      .catch(error => {
        document.getElementById("last-updated").textContent = "Unable to load tutor-database.json";
        document.getElementById("last-updated").className = "error";
        document.getElementById("profile-summary").textContent = error.message;
      });
  </script>
</body>
</html>
